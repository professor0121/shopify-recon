name: Shopify Recon Pipeline

on:
  workflow_dispatch:
    inputs:
      store_url:
        description: 'Shopify Store URL (e.g. https://rothys.com)'
        required: true
        type: string
        default: 'https://rothys.com'
      mode:
        description: 'Reconnaissance Mode'
        required: true
        type: choice
        options:
          - 'clone'         # Full clone: extract + analyze + generate Liquid theme + HTML website
          - 'analyze'       # Run all 6 analyzers (DNA, CSS, Sections, Cart, Products, JS)
          - 'extract'       # Extract raw store data only
          - 'theme-dna'     # Theme fingerprint only
          - 'seo-xray'      # SEO analysis only
          - 'perf-profiler' # Performance profile only
        default: 'clone'
      artifact_name:
        description: 'Downloadable Artifact Name'
        required: false
        type: string
        default: 'shopify-recon-output'
      retention_days:
        description: 'Artifact Retention Days (1-90)'
        required: false
        type: number
        default: 14

jobs:
  recon:
    name: Run Shopify Recon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Fetch Recon Tools (if not in workspace)
        run: |
          if [ ! -f "shopify-clone-master.sh" ] && [ ! -f "shopify-recon.py" ]; then
            echo "Local source scripts not found. Cloning shopify-recon repository..."
            git clone https://github.com/krickelsync/shopify-recon.git temp_recon
            rsync -av --exclude='.git' --exclude='.github' temp_recon/ ./
            rm -rf temp_recon
          else
            echo "Source scripts detected in repository."
          fi

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl rsync

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install rich

      - name: Ensure Shell Scripts Are Executable
        run: |
          chmod +x *.sh 2>/dev/null || true

      - name: Prepare Output Directory
        run: |
          rm -rf ./output
          mkdir -p ./output

      - name: Execute Shopify Recon
        run: |
          STORE_URL="${{ inputs.store_url }}"
          MODE="${{ inputs.mode }}"
          OUTPUT_DIR="./output"

          echo "=========================================="
          echo "Target Store: $STORE_URL"
          echo "Mode:         $MODE"
          echo "Output Dir:   $OUTPUT_DIR"
          echo "=========================================="

          case "$MODE" in
            "clone")
              echo "Executing full clone pipeline..."
              ./shopify-clone-master.sh clone "$STORE_URL" "$OUTPUT_DIR"
              ;;
            "analyze")
              echo "Executing analysis pipeline..."
              ./shopify-clone-master.sh analyze "$STORE_URL" "$OUTPUT_DIR"
              ;;
            "extract")
              echo "Executing raw data extraction..."
              ./shopify-clone-master.sh extract "$STORE_URL" "$OUTPUT_DIR"
              ;;
            "theme-dna")
              echo "Executing Theme DNA fingerprint..."
              python3 theme-dna.py --url="$STORE_URL" | tee "$OUTPUT_DIR/theme-dna-report.txt"
              ;;
            "seo-xray")
              echo "Executing SEO X-Ray..."
              python3 seo-xray.py --url="$STORE_URL" | tee "$OUTPUT_DIR/seo-xray-report.txt"
              ;;
            "perf-profiler")
              echo "Executing Performance Profiler..."
              python3 perf-profiler.py --url="$STORE_URL" | tee "$OUTPUT_DIR/perf-profiler-report.txt"
              ;;
            *)
              echo "Unknown mode: $MODE. Defaulting to full clone..."
              ./shopify-clone-master.sh clone "$STORE_URL" "$OUTPUT_DIR"
              ;;
          esac

          # IMPORTANT: No deployment step (deploy.sh is strictly never called).
          # The theme is NOT uploaded to any Shopify store, S3, or third-party server.

      - name: Upload Output Folder as Downloadable Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact_name }}
          path: ./output/
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: warn

      - name: Generate Run Summary
        if: always()
        run: |
          echo "## 🛍️ Shopify Recon Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Store:** \`${{ inputs.store_url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode:** \`${{ inputs.mode }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name:** \`${{ inputs.artifact_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Remote Upload:** 🚫 Disabled (Theme is kept private and not uploaded anywhere)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📂 Output Contents" >> $GITHUB_STEP_SUMMARY
          if [ -d "./output" ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            find ./output -maxdepth 2 | head -n 40 >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "No output files found." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 How to Download" >> $GITHUB_STEP_SUMMARY
          echo "1. Scroll down to the **Artifacts** section at the bottom of this run summary." >> $GITHUB_STEP_SUMMARY
          echo "2. Click on **\`${{ inputs.artifact_name }}\`** to download the complete output as a \`.zip\` file." >> $GITHUB_STEP_SUMMARY
